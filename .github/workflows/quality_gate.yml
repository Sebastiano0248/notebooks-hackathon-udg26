name: Quality Gate


on: [workflow_call]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: 🧹 Linting (Check for Syntax Errors)
        run: |
          ruff check .

      - name: 🛠️ Code Formatting Check
        run: |
          ruff format --check .
